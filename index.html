<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Для тебя 💌</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 25% 20%,#fbe9e4 0%,#f1c9c6 35%,#d99aa3 70%,#a85a6a 100%);font-family:Georgia,'DejaVu Serif',serif}
.env{width:340px;height:240px;position:relative;cursor:pointer;background:linear-gradient(180deg,#fdf3ea,#f5e1d3);border:1px solid #e3b9b4;border-radius:12px;box-shadow:0 18px 40px rgba(122,40,60,.25);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;transition:transform .4s}
.env:hover{transform:scale(1.03)}
.env:before{content:"";position:absolute;top:0;left:0;right:0;border-left:170px solid transparent;border-right:170px solid transparent;border-top:110px solid #edc4bf;border-radius:10px 10px 0 0}
.seal{position:absolute;top:88px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#b5566b,#8e3a50);color:#fde8ea;box-shadow:0 3px 8px rgba(110,30,50,.35);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2}
.msg{position:relative;z-index:1;margin-top:100px;font-size:17px;color:#8e3a50;line-height:1.35}
.hint{position:absolute;bottom:-34px;width:100%;left:0;color:#fff6f2;font-size:14px;opacity:.85}
.cert{display:none;width:360px;max-width:calc(100vw - 24px);background:linear-gradient(135deg,#fff8f2,#f7e2d8);border:3px double #c98a93;border-radius:14px;padding:30px;box-sizing:border-box;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25);color:#6b3a44;animation:pop .6s}
.cert h1{font-size:26px;margin:6px 0;color:#8e3a50;letter-spacing:2px}
.cert .big{font-size:22px;margin:14px 0;color:#a8475d}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.fade{animation:pop .5s}
body.open-cert{align-items:flex-start;padding:24px 8px 32px}
.preview-link{display:block;margin:16px 0 8px;line-height:0}
.preview{width:100%;border-radius:8px;border:1px solid #e3b9b4;box-shadow:0 8px 18px rgba(122,40,60,.18);background:#fff}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.btn{display:block;text-decoration:none;font:16px/1.2 Georgia,'DejaVu Serif',serif;padding:13px 16px;min-height:44px;box-sizing:border-box;border-radius:10px;background:linear-gradient(180deg,#b5566b,#8e3a50);color:#fde8ea;box-shadow:0 3px 8px rgba(110,30,50,.25)}
.btn.secondary{background:transparent;color:#8e3a50;border:1.5px solid #c98a93;box-shadow:none}
</style></head><body>
<div class="env" id="env"><div class="seal">♥</div><div class="msg" id="msg">Открой меня</div><div class="hint" id="hint">нажми на конверт</div></div>
<div class="cert" id="cert">
<div>✦ ПОДАРОЧНЫЙ СЕРТИФИКАТ ✦</div>
<h1>Охта Кай</h1><div>центр СПА</div>
<div class="big">Твой день для себя 🌸</div>
<div>Расслабься, отдохни и перезагрузись</div>
<a class="preview-link" href="cert.pdf" target="_blank" rel="noopener"><img class="preview" src="cert-preview.jpg" alt="Подарочный сертификат Охта Кай"></a>
<div class="actions">
<a class="btn" href="cert.pdf" target="_blank" rel="noopener">Открыть сертификат</a>
<a class="btn secondary" href="cert.pdf" download="Сертификат_Охта_Кай.pdf">Скачать PDF</a>
</div>
</div>
<script>
const steps=["Я хочу сделать твой день ярче","Я хочу, чтоб ты сегодня кайфанула чисто для себя и перезагрузилась","Я скучаю"];
let i=0;const env=document.getElementById('env'),msg=document.getElementById('msg'),hint=document.getElementById('hint');
env.onclick=()=>{if(i<steps.length){msg.textContent=steps[i];msg.classList.remove('fade');void msg.offsetWidth;msg.classList.add('fade');i++;hint.textContent=i<steps.length?'открой ещё раз':'открой последний раз';}else{env.style.display='none';document.getElementById('cert').style.display='block';document.body.classList.add('open-cert');}};
const s=new URLSearchParams(location.search).get('step');if(s){for(let k=0;k<+s;k++)env.click();}
</script></body></html>
